<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNovel Project</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- 6.jpg 참고: 상단 광고 및 헤더 -->
        <header class="main-header">
            <div class="ad-banner">광고 영역</div>
            <nav class="pc-nav">
                <button onclick="showView('home')">홈</button>
                <button onclick="showView('library')">서재</button>
                <button onclick="showView('write-menu')">연재하기</button>
                <button id="auth-btn" onclick="handleAuth()">로그인</button>
            </nav>
        </header>

        <main id="content-area">
            <!-- 2.jpg 참고: 홈/랭킹 화면 -->
            <section id="view-home" class="view">
                <div class="ranking-container">
                    <h2>실시간 랭킹</h2>
                    <div class="ranking-grid" id="ranking-list">
                        <!-- 데이터가 여기 표시됩니다 -->
                    </div>
                </div>
                <div class="novel-grid-section">
                    <h3>최신 연재 작품 <span class="search-icon">🔍</span></h3>
                    <div id="novel-list" class="grid-display"></div>
                </div>
            </section>

            <!-- 1.jpg 참고: 서재 화면 -->
            <section id="view-library" class="view" style="display:none;">
                <h2>내 서재</h2>
                <div class="library-flex" id="my-library">
                    <!-- 읽던 작품 목록 (1.jpg 구조) -->
                </div>
            </section>

            <!-- 3.jpg 참고: 글 관리 메뉴 -->
            <section id="view-write-menu" class="view" style="display:none;">
                <div class="write-hub">
                    <button class="hub-btn" onclick="showView('editor')">새 글 작성</button>
                    <button class="hub-btn">내 완결작</button>
                    <button class="hub-btn full">이벤트 및 공지사항</button>
                </div>
            </section>

            <!-- 4.jpg & 5.jpg & 6.jpg 참고: 에디터 및 등록 -->
            <section id="view-editor" class="view" style="display:none;">
                <div class="editor-header">
                    <div class="tools"><b>B</b> <i>I</i> <u>U</u> <s>S</s> 🎨</div>
                    <button class="submit-btn" onclick="saveNovel()">등록</button>
                </div>
                <input type="text" id="novel-title" placeholder="제목을 입력하세요 (6.jpg 참고)">
                <textarea id="novel-content" placeholder="내용을 입력하세요..."></textarea>
            </section>
        </main>

        <!-- 모바일 전용 하단바 (6.jpg 참고) -->
        <nav class="mobile-nav">
            <button onclick="showView('home')">🏠</button>
            <button onclick="showView('library')">📚</button>
            <button onclick="showView('write-menu')">✍️</button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
